name: Standalone tools

on:
  push:
    paths: ['tools/**', '.github/workflows/tools.yml']
  pull_request:
    paths: ['tools/**', '.github/workflows/tools.yml']

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install attachment downloader dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check tool boundaries and portable behavior
        run: python -B -m unittest discover -s tools/tests -v
